name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer (incl. latest.yml for auto-update)
        run: npm run build && npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*/ratioAI-Setup-*.exe
            release/*/ratioAI-Setup-*.exe.blockmap
            release/*/latest.yml
      - name: Attach installer to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/*/ratioAI-Setup-*.exe
            release/*/ratioAI-Setup-*.exe.blockmap
            release/*/latest.yml
