name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:web

  # the sound helper of Clips only builds on Windows (WASAPI process loopback)
  audio-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked --manifest-path native/audio/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: ratio-audio
          path: native/audio/target/release/ratio-audio.exe
