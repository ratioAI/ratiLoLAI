[package]
name = "ratio-audio"
version = "1.3.0"
edition = "2021"
description = "Records the PC sound but ratioAI, or one process only (WASAPI process loopback), for ratioAI's Clips and finds the game window"
license = "MIT"
publish = false

[dependencies]
# pinned: the capture code follows this version's API (examples/record_application.rs)
wasapi = "=0.19.0"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
